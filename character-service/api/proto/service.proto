syntax = "proto3";
package character_service;

option go_package = "github.com/alsadx/GM-Tool/character-service/gen/service";

import "character.proto";

service CharacterService {
  rpc CreateCharacter(CreateCharRequest) returns (CreateCharResponse);
  rpc GetCharacter(GetCharRequest) returns (GetCharResponse);
  rpc UpdateCharacter(UpdateCharRequest) returns (UpdateCharResponse);
  rpc DeleteCharacter(DeleteCharRequest) returns (DeleteCharResponse);
  rpc ListCharacters(ListCharRequest) returns (ListCharResponse);

  rpc GainExp(ExpRequest) returns (CharacterResponse);
  rpc RemoveExp(ExpRequest) returns (CharacterResponse);
  rpc TakeDamage(DamageRequest) returns (CharacterResponse);
  rpc Heal(HealRequest) returns (CharacterResponse);
  rpc LevelUp(LevelRequest) returns (CharacterResponse);
  rpc LevelDown(LevelRequest) returns (CharacterResponse);
  rpc SetLevel(SetLevelRequest) returns (CharacterResponse);
  rpc AddHitDice(HitDiceRequest) returns (CharacterResponse);
  rpc RemoveHitDice(HitDiceRequest) returns (CharacterResponse);
  rpc SetMaxHp(HpRequest) returns (CharacterResponse);
  rpc SetTempHp(HpRequest) returns (CharacterResponse);
  rpc CheckAbility(CheckAbilityRequest) returns (CheckResponse);
  rpc CheckSkill(CheckSkillRequest) returns (CheckResponse);
  rpc GetStatus(GetStatusRequest) returns (StatusResponse);
}

message ExpRequest {
  string character_id = 1;
  int32 amount = 2;
}

message DamageRequest {
  string character_id = 1;
  int32 damage = 2;
}

message HealRequest {
  string character_id = 1;
  int32 amount = 2;
}

message LevelRequest {
  string character_id = 1;
}

message SetLevelRequest {
  string character_id = 1;
  int32 level = 2;
}

message HitDiceRequest {
  string character_id = 1;
  int32 dice_type = 2;
}

message HpRequest {
  string character_id = 1;
  int32 amount = 2;
}

message CheckAbilityRequest {
  string character_id = 1;
  int32 ability = 2;
}

message CheckSkillRequest {
  string character_id = 1;
  int32 skill = 2;
}

message CheckResponse {
  int32 dice_result = 1;
  int32 bonus = 2;
  int32 total = 3;
}

message GetStatusRequest {
  string character_id = 1;
}

message StatusResponse {
  int32 current_hp = 1;
  int32 temp_hp = 2;
  int32 max_hp = 3;
  bool is_knocked = 4;
  int32 level = 5;
  int32 current_exp = 6;
  int32 exp_to_next = 7;
}

message CharacterResponse {
  character.Character character = 1;
}

message CreateCharRequest {
  int64 owner_id = 1;
  string name = 2;
  string class_name = 3;
  string subclass = 4;
  string race = 5;
}

message CreateCharResponse {
  string id = 1;
}

message GetCharRequest {
  string id = 1;
}

message GetCharResponse {
  character.Character character = 1;
}

message UpdateCharRequest {
  string id = 1;
  string name = 2;
  string class = 3;
  string subclass = 4;
  string race = 5;
}

message UpdateCharResponse {
  bool success = 1;
}

message DeleteCharRequest {
  string id = 1;
}

message DeleteCharResponse {
  bool success = 1;
}

message ListCharRequest {
  int64 owner_id = 1;
}

message ListCharResponse {
  repeated character.Character characters = 1;
}